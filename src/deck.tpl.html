<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Геймдев · Такт 2 — объекты конкуренции и бутылочные горлышки</title>
<style>
/*FONTS*/

/* ============ токены ============ */
:root{
  --paper:#F1ECE3;      /* кремовая бумага — основной фон */
  --paper-2:#E7E1D5;    /* вторая бумага, для полос и заливок */
  --tile:#FFFFFF;       /* плитки логотипов и карточки */
  --ink:#16140F;        /* текст, 15:1 к бумаге */
  --muted:#6B6558;      /* вторичный текст, 5.6:1 к бумаге */
  --hair:#D3CCBE;       /* линейки */
  --jet:#14130F;        /* полноэкранные тёмные слайды */
  --flame:#F26A1B;      /* единственный акцент */
  --flame-ink:#B34405;  /* оранжевый для мелкого текста на бумаге, 4.8:1 */
  --sage:#DCE2D9;       /* мягкая карточка */
  --f:'Onest','Segoe UI',system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0E0D0B;overflow:hidden}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ============ сцена 16:9 ============ */
#stage{position:fixed;inset:0;overflow:hidden;background:#0E0D0B}
#deck{position:absolute;left:50%;top:50%;width:1600px;height:900px;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;
  background:var(--paper);overflow:hidden}

/* ============ слайд ============ */
.s{position:absolute;inset:0;z-index:3;padding:62px 78px 66px;
  opacity:0;visibility:hidden;pointer-events:none;
  display:flex;flex-direction:column;background:var(--paper)}
.s.live{opacity:1;visibility:visible;pointer-events:auto}
.s.dark{background:var(--jet);color:var(--paper)}
.s.hot{background:var(--flame);color:var(--ink)}

/* верхняя строка: пилюля слева, счётчик справа */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;flex:none}
/* на слайдах с прижатым/центрированным контентом шапка всё равно держится сверху */
.cover .top,.sec .top{margin-bottom:auto}
.pill{display:inline-flex;align-items:center;height:36px;padding:0 20px;border-radius:999px;
  border:2px solid var(--ink);font-size:14.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap}
.dark .pill{border-color:rgba(241,236,227,.42);color:var(--paper)}
.hot .pill{border-color:rgba(22,20,15,.5)}
.cnt{font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.dark .cnt{color:rgba(241,236,227,.55)}
.hot .cnt{color:rgba(22,20,15,.62)}

/* ============ типографика ============ */
h1{font-weight:900;letter-spacing:-.035em;line-height:1.0;text-transform:uppercase}
h2{font-weight:800;font-size:62px;letter-spacing:-.03em;line-height:1.02}
h3{font-weight:700;font-size:21px;letter-spacing:-.012em;line-height:1.2}
p{font-size:24px;line-height:1.46;max-width:60ch}
.lede{font-size:31px;line-height:1.34;font-weight:400}
.mut{color:var(--muted)}
.dark .mut{color:rgba(241,236,227,.66)}
.hot .mut{color:rgba(22,20,15,.72)}
strong{font-weight:700}
b{font-weight:700}
.ob{color:var(--flame-ink);font-weight:600}       /* объект конкуренции */
.dark .ob,.hot .ob{color:var(--flame)}
.dark .ob{color:#FF8B3D}
.hot .ob{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* появление */
.r{opacity:0;transform:translateY(12px)}
.s.live .r{animation:rise .46s cubic-bezier(.22,.75,.2,1) forwards;animation-delay:calc(var(--i,0)*58ms + 90ms)}
@keyframes rise{to{opacity:1;transform:none}}

/* ============ обложка ============ */
.cover{justify-content:flex-end;overflow:hidden}
.cover h1{font-size:150px;line-height:1.0;padding-top:.02em}
.cover .sub{font-size:33px;font-weight:500;line-height:1.28;margin-top:26px;max-width:30ch}
.cover .meta-b{display:flex;gap:52px;margin-top:44px;padding-top:26px;
  border-top:2px solid rgba(22,20,15,.28);font-size:18px;font-weight:700;letter-spacing:.02em}
.rays{position:absolute;right:-190px;top:-230px;width:720px;height:720px;opacity:.5;pointer-events:none}

/* ============ разделитель раздела ============ */
.sec{justify-content:center}
.sec .huge{position:absolute;right:78px;top:44px;font-size:250px;font-weight:900;
  letter-spacing:-.05em;line-height:.8;color:var(--flame)}
.sec h1{font-size:104px;max-width:14ch}
.sec .note{margin-top:30px;font-size:24px;line-height:1.5;max-width:52ch;color:rgba(241,236,227,.72)}

/* ============ карта уровней ============ */
.map{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0}
.lvl{display:grid;grid-template-columns:58px 250px 1fr auto;align-items:center;gap:0 24px;
  background:var(--tile);border-radius:14px;padding:8px 22px 8px 16px;flex:1;min-height:0}
.lvl .no{font-size:24px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;
  text-align:center;letter-spacing:-.02em}
.lvl .nm{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.08}
.lvl .oj{font-size:24px;font-weight:600;color:var(--flame-ink);line-height:1.18}
.lvl .who{display:flex;align-items:center;gap:20px;justify-content:flex-end;min-width:322px}
.lvl .who .ic{width:46px;height:46px;flex:none}
.lvl .who .txt{font-size:15.5px;color:var(--muted);line-height:1.26;text-align:right;max-width:150px}
.lvl.neck{background:var(--jet)}
.lvl.neck .nm{color:var(--flame)}
.lvl.neck .no{color:rgba(242,106,27,.75)}
.lvl.neck .oj{color:#FF9A52}
.lvl.neck .who .txt{color:rgba(241,236,227,.62)}
.maphead{display:grid;grid-template-columns:58px 250px 1fr auto;gap:0 24px;padding:0 22px 10px 16px;
  font-size:13.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex:none}
.maphead span:last-child{min-width:322px;text-align:right}

/* ============ логотипы ============ */
.ic{fill:currentColor}
.lvl.neck .who .ic{color:var(--paper)!important}

/* ============ плитки логотипов ============ */
.wall{display:grid;gap:11px;flex:1;min-height:0}
.tile{background:var(--tile);border-radius:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;padding:13px 8px;min-height:0}
.tile .ic{width:64px;height:64px;flex:none}
.tile .nmb{font-size:15px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.tile.wide{flex-direction:row;gap:14px;justify-content:flex-start;padding:15px 18px}
.tile.wide svg{width:34px;height:34px}
.tile.wide .nmb{text-align:left;font-size:14.5px;color:var(--ink);font-weight:700}
.wallgrp{display:flex;flex-direction:column;gap:12px;min-height:0}
.wallgrp .cap{font-size:17px;font-weight:600;letter-spacing:.02em;color:var(--ink);flex:none;line-height:1.3}
.wallgrp .cap b{font-weight:900}
.wallgrp .cap em{font-style:normal;color:var(--flame-ink);font-weight:700}
.wallgrp.hot .cap em{color:var(--ink)}
.wallgrp .grid{display:grid;gap:9px;flex:1;min-height:0}

/* ============ пайплайн: шаги со стрелками ============ */
.pipe{display:flex;align-items:stretch;gap:0;flex:1;min-height:0;margin-top:8px}
/* цепочка без иконок — шаги по контенту и по центру полосы */
.pipe.compact{align-items:center}
.pipe .st{flex:1;min-width:0;background:var(--tile);border-radius:16px;padding:24px 22px;
  display:flex;flex-direction:column}
.pipe .st.last{background:var(--flame)}
/* шаг без иконки — контент по центру, иначе низ пустует */
.pipe .st.mid{justify-content:center;align-self:center}
.pipe .st.mid h5{margin-top:0}
.pipe .st .no{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--flame-ink);margin-bottom:14px}
.pipe .st.last .no{color:rgba(22,20,15,.7)}
.pipe .st .ui{width:56px;height:56px;margin-bottom:auto}
.pipe .st.last .ui{stroke:var(--ink)}
.pipe .st h5{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:16px 0 8px}
.pipe .st p{font-size:15px;line-height:1.32;color:var(--muted);max-width:none}
.pipe .st.last p{color:rgba(22,20,15,.78)}
.pipe .ar{flex:0 0 34px;display:flex;align-items:center;justify-content:center}
.pipe .ar::after{content:"";width:0;height:0;border:9px solid transparent;border-left:12px solid var(--flame)}

/* ============ платформа против витрины ============ */
.pvs{background:var(--tile);border-radius:16px;padding:22px 28px;margin-top:18px;
     font-size:21px;line-height:1.4;color:var(--muted)}
.pvs b{color:var(--ink);font-weight:700}

/* ============ смысловые иконки ============ */
/* иконка — иллюстрация в круглом бейдже, а не буллит */
.badge{width:150px;height:150px;border-radius:50%;background:var(--paper-2);display:grid;
    place-items:center;flex:none}
.card.dark .badge{background:rgba(241,236,227,.1)}
.card.sage .badge{background:rgba(255,255,255,.72)}
.card.hot .badge{background:rgba(22,20,15,.12)}
.ui{width:84px;height:84px;flex:none;stroke:var(--flame);stroke-width:1.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
.card.dark .ui{stroke:var(--flame)}
.card.hot .ui{stroke:var(--ink)}
.ui.big{width:76px;height:76px;stroke-width:1.9}

/* ============ сравнение двух этажей ============ */
.vs{display:grid;grid-template-columns:1fr 48px 1fr;align-items:stretch;gap:0;
    background:var(--tile);border-radius:14px;padding:15px 24px}
.vs .side{display:flex;flex-direction:column;justify-content:center}
.vs .side .lb{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px}
.vs .side .tx{font-size:19px;line-height:1.28;font-weight:600}
.vs .side .tx em{font-style:normal;color:var(--flame-ink)}
.vs .mid{display:flex;align-items:center;justify-content:center;font-size:24px;
    font-weight:900;color:var(--flame)}

/* ============ стена логотипов: группы как отдельные панели ============ */
.wallgrp{background:var(--paper-2);border-radius:16px;padding:18px 20px 20px}
.wallgrp.hot{background:#F9DFCB}
.tile.mark{outline:3px solid var(--flame);outline-offset:-3px}
.tile.mark .nmb{color:var(--flame-ink);font-weight:800}

/* ============ карточки ============ */
.cards{display:grid;gap:15px}
.cards > *{min-width:0}
.card *{min-width:0}
/* только прямой потомок слайда растёт: вложенные сетки остаются по контенту */
.s > .cards{flex:1;min-height:0}
/* карточки не растягиваются на всю высоту: короткий текст в высокой карточке
   оставлял пустоты сверху и снизу. Ряд карточек центрируется в кадре целиком */
.s > .cards{align-items:stretch;grid-auto-rows:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.col > .card{flex:1;min-height:0;justify-content:center;padding:22px 28px}
.col > .card > .kn{margin-bottom:10px}
.s > .cards > .card{min-height:0}
/* якорь карточки (иконка, метка, ряд логотипов) держится сверху, текст уходит вниз —
   карточка заполняет ряд без пустот посередине */
/* якорь карточки — один блок сверху, текст прижат к низу */
.card > .anchor{margin-bottom:22px}
.card > .anchor > .kn{margin-bottom:14px}
.card > .anchor > .logos + .kn,.card > .anchor > .badge + .kn{margin-top:14px;margin-bottom:0}
.card.mid > .anchor{margin-bottom:22px}
.card > .badge,.card > .kn,.card > .logos{margin-bottom:auto}
.card.mid{justify-content:center}
.card.mid > .badge,.card.mid > .kn,.card.mid > .logos{margin-bottom:22px}
.logos{display:flex;gap:18px;flex-wrap:wrap}
.logos .ic{width:86px!important;height:86px!important}
.logos.solo{justify-content:flex-start}
.logos.solo .ic{width:170px!important;height:170px!important}
.badge .ic{width:104px!important;height:104px!important}
/* растровые логотипы: высота фиксирована, ширина по пропорции */
img.ic{width:auto!important;object-fit:contain;display:block}
.lvl .who img.ic{height:40px!important;max-width:104px}
.tile img.ic{height:52px!important;max-width:150px}
.badge img.ic{height:72px!important;max-width:132px}
.logos img.ic{height:54px!important;max-width:150px}
.s > h2{margin-bottom:28px}
.vs{justify-content:center}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--tile);border-radius:16px;padding:28px 30px;display:flex;flex-direction:column;min-width:0}
.card.sage{background:var(--sage)}
.card.dark{background:var(--jet);color:var(--paper)}
.card.dark .mut{color:rgba(241,236,227,.7)}
.card.hot{background:var(--flame)}
.card h4{font-size:30px;font-weight:800;letter-spacing:-.024em;line-height:1.1;margin-bottom:14px}
/* один ряд — одна высота заголовка, иначе абзацы не выстраиваются по базовой линии */
.cards.c3 > .card > h4{min-height:2.2em}
/* блок карточки центрируется целиком: заголовки встают на одну линию */
.s > .cards.c3 > .card{justify-content:center}
.card p{font-size:23px;line-height:1.42;color:var(--muted)}
.card.dark p{color:rgba(241,236,227,.74)}
.card.hot p{color:rgba(22,20,15,.8)}
.card p+p{margin-top:9px}
.card .kn{font-size:14.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--flame-ink);margin-bottom:12px}
.card.dark .kn{color:var(--flame)}

/* списки */
ul{list-style:none}
li{position:relative;padding-left:30px;font-size:24px;line-height:1.4;margin-bottom:16px}
li::before{content:"";position:absolute;left:0;top:.5em;width:13px;height:13px;border-radius:50%;
  background:var(--flame)}
.dark li::before{background:var(--flame)}

/* ============ крупные числа ============ */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.fig{padding-right:34px}
.fig+.fig{padding-left:34px;border-left:1.5px solid var(--hair)}
.dark .fig+.fig{border-left-color:rgba(241,236,227,.2)}
.fig .n{font-size:108px;font-weight:900;letter-spacing:-.05em;line-height:.88;color:var(--flame-ink)}
.dark .fig .n{color:var(--flame)}
.fig .l{font-size:20px;line-height:1.38;color:var(--muted);margin-top:16px}
.dark .fig .l{color:rgba(241,236,227,.7)}

/* ============ до / после ============ */
.ba{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0}
.barow{display:grid;grid-template-columns:1fr 34px 1.32fr;align-items:center;gap:0 18px;
  background:var(--tile);border-radius:12px;padding:11px 20px;flex:1;min-height:0}
.barow .was{font-size:16.5px;color:var(--muted);text-decoration:line-through;
  text-decoration-color:var(--hair);text-decoration-thickness:1.5px}
.barow .ar{color:var(--flame);font-weight:800;font-size:19px;text-align:center}
.barow .now{font-size:17.5px;line-height:1.34}
.barow .now b{font-weight:700}

/* ============ цепочка отказов ============ */
.chain{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-height:0}
.ch{background:var(--tile);border-radius:15px;padding:22px;display:flex;flex-direction:column}
.ch.dead{background:var(--jet);color:var(--paper)}
.ch h4{font-size:26px;font-weight:800;letter-spacing:-.022em;line-height:1.12;margin-bottom:14px}
.ch.dead h4{color:var(--flame)}
.ch p{font-size:21px;line-height:1.4;color:var(--muted)}
.ch.dead p{color:rgba(241,236,227,.74)}
.ch .verd{margin-top:auto;padding-top:18px;font-size:21px;font-weight:800;line-height:1.2}
.ch.dead .verd{color:var(--flame)}

/* ============ воронка-горлышко ============ */
/* воронка: конус клип-путём, горло и подписи — обычный текст */
.fn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:0}
.fn .cap{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:16px}
.fn .cone{width:100%;height:236px;background:var(--paper-2);position:relative;flex:none;
  clip-path:polygon(0 0,100% 0,58% 100%,42% 100%)}
.fn .cone i{position:absolute;left:0;right:0;height:2px;background:var(--tile)}
.fn .neck{width:16%;background:var(--flame);padding:13px 0 11px;text-align:center;flex:none}
.fn .neck b{display:block;font-size:29px;font-weight:900;letter-spacing:-.03em;line-height:1}
.fn .neck s{display:block;text-decoration:none;font-size:10px;font-weight:700;
  letter-spacing:.12em;color:rgba(22,20,15,.72);margin-top:3px}
.fn .arw{width:3px;height:34px;background:var(--flame);flex:none;position:relative}
.fn .arw::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
  border:8px solid transparent;border-top:12px solid var(--flame)}
.fn .out{margin-top:20px;font-size:15px;font-weight:800;letter-spacing:.06em}

/* ============ источники ============ */
.srcwrap{flex:1;min-height:0;background:var(--tile);border-radius:16px;padding:6px 28px 10px;overflow:hidden}
.src{width:100%;border-collapse:collapse;font-size:17.5px;line-height:1.3}
.src th{text-align:left;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:14px 14px 10px 0;border-bottom:2px solid var(--hair)}
.src td{padding:10px 14px 10px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.src tr:last-child td{border-bottom:none}
.src td.c1{font-weight:600;color:var(--ink);width:46%}
.src td.c2{color:var(--muted);width:15%;white-space:nowrap}
.src td.c3 a{color:var(--flame-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.src td.c3 .x{color:var(--muted);font-size:15px}

/* ============ глоссарий ============ */
.gl{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:11px;min-height:0}
.gi{background:var(--tile);border-radius:14px;padding:20px 26px;display:flex;flex-direction:column;
    justify-content:center;min-height:0}
.gi dt{font-size:24px;font-weight:800;letter-spacing:-.022em;margin-bottom:8px}
.gi dd{font-size:19px;line-height:1.38;color:var(--muted)}

.mt{margin-top:auto}
.note{font-size:20px;line-height:1.46;color:var(--muted);max-width:112ch}
.dark .note{color:rgba(241,236,227,.66)}
.hot .note{color:rgba(22,20,15,.76)}
.after{margin-top:22px}

/* ============ переход ============ */
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background:var(--flame)}
#wipe.go{animation:sweep .4s cubic-bezier(.62,0,.36,1)}
@keyframes sweep{
  0%{opacity:1;transform:scaleX(0);transform-origin:left center}
  48%{opacity:1;transform:scaleX(1);transform-origin:left center}
  52%{opacity:1;transform:scaleX(1);transform-origin:right center}
  100%{opacity:1;transform:scaleX(0);transform-origin:right center}
}
.s.in{animation:slidein .36s cubic-bezier(.22,.75,.2,1)}
@keyframes slidein{0%{opacity:0;transform:translateY(var(--dy,14px))}100%{opacity:1;transform:none}}

/* ============ обзор ============ */
#ov{position:fixed;inset:0;z-index:40;background:rgba(20,19,15,.97);display:none;
  grid-template-columns:repeat(5,1fr);gap:14px;padding:36px;overflow:auto;align-content:start}
#ov.on{display:grid}
.ovc{aspect-ratio:16/9;border-radius:11px;background:var(--paper);cursor:pointer;border:2px solid transparent;
  padding:13px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  font-family:var(--f);transition:border-color .16s}
.ovc:hover,.ovc:focus-visible{border-color:var(--flame);outline:none}
.ovc.cur{border-color:var(--flame)}
.ovc .t{font-size:14px;font-weight:700;line-height:1.16;color:var(--ink)}
.ovc .i{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

#help{position:fixed;right:14px;bottom:11px;z-index:30;font-size:11.5px;color:#5A544A;
  font-weight:600;letter-spacing:.07em;transition:opacity .5s;pointer-events:none}
#help.hide{opacity:0}
:focus-visible{outline:2px solid var(--flame);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  #wipe.go,.s.in{animation:none}
  .s.live .r{animation:none;opacity:1;transform:none}
}

/* ============ печать в PDF ============ */
@media print{
  @page{size:1600px 900px;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  #stage{position:static;display:block}
  #deck{position:static;left:auto;top:auto;transform:none;width:1600px;height:auto;overflow:visible}
  #help,#ov,#wipe{display:none!important}
  .s{position:relative;inset:auto;width:1600px;height:900px;opacity:1!important;visibility:visible!important;
     page-break-after:always;break-after:page}
  .s:last-of-type{page-break-after:auto;break-after:auto}
  .s .r{opacity:1!important;transform:none!important;animation:none!important}
}
</style>
</head>
<body>

<div id="stage">
  <div id="deck"><!--SPRITE--><div id="wipe"></div><!--SLIDES--></div>
</div>

<div id="ov" role="dialog" aria-label="Все слайды" aria-modal="true"></div>
<div id="help">← → СЛАЙДЫ · O ОБЗОР · F ПОЛНЫЙ ЭКРАН</div>

<script>
(function(){
  'use strict';
  var deck=document.getElementById('deck');
  var slides=[].slice.call(deck.querySelectorAll('.s'));
  var wipe=document.getElementById('wipe');
  var ov=document.getElementById('ov');
  var help=document.getElementById('help');
  var cur=0, total=slides.length;
  var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  function fit(){
    deck.style.setProperty('--s', Math.min(window.innerWidth/1600, window.innerHeight/900));
  }
  window.addEventListener('resize',fit,{passive:true}); fit();

  function show(n,dir){
    n=Math.max(0,Math.min(total-1,n));
    if(n===cur && slides[cur].classList.contains('live')) return;
    slides[cur].classList.remove('live','in');
    cur=n;
    var el=slides[cur];
    el.classList.add('live');
    if(!reduce){
      el.style.setProperty('--dy',(dir<0?-14:14)+'px');
      void el.offsetWidth; el.classList.add('in');
      wipe.classList.remove('go'); void wipe.offsetWidth; wipe.classList.add('go');
    }
    var rs=el.querySelectorAll('.r'), i;
    for(i=0;i<rs.length;i++) rs[i].style.animation='none';
    void el.offsetWidth;
    for(i=0;i<rs.length;i++) rs[i].style.animation='';
    if(ov.classList.contains('on')) syncOv();
    try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
  }
  var next=function(){ show(cur+1,1); };
  var prev=function(){ show(cur-1,-1); };

  function buildOv(){
    ov.innerHTML='';
    slides.forEach(function(s,i){
      var b=document.createElement('button');
      b.className='ovc'+(i===cur?' cur':'');
      b.innerHTML='<div class="t">'+(s.getAttribute('data-t')||'')+'</div>'+
                  '<div class="i">'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'</div>';
      b.addEventListener('click',function(){ toggleOv(false); show(i, i>cur?1:-1); });
      ov.appendChild(b);
    });
  }
  function syncOv(){ for(var i=0;i<ov.children.length;i++) ov.children[i].classList.toggle('cur', i===cur); }
  function toggleOv(on){
    var want=(on===undefined)?!ov.classList.contains('on'):on;
    ov.classList.toggle('on',want);
    if(want){ buildOv(); var c=ov.querySelector('.cur'); if(c) c.focus(); }
  }

  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(ov.classList.contains('on')){
      if(k==='Escape'||k==='o'||k==='O'||k==='щ'||k==='Щ'){ e.preventDefault(); toggleOv(false); }
      return;
    }
    if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'||k==='ArrowDown'){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'||k==='ArrowUp'||k==='Backspace'){ e.preventDefault(); prev(); }
    else if(k==='Home'){ e.preventDefault(); show(0,-1); }
    else if(k==='End'){ e.preventDefault(); show(total-1,1); }
    else if(k==='o'||k==='O'||k==='щ'||k==='Щ'){ e.preventDefault(); toggleOv(); }
    else if(k==='f'||k==='F'||k==='а'||k==='А'){ e.preventDefault();
      if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  });

  document.getElementById('stage').addEventListener('click',function(e){
    if(ov.classList.contains('on')) return;
    (e.clientX < window.innerWidth*0.24) ? prev() : next();
  });
  var tx=0,ty=0;
  document.addEventListener('touchstart',function(e){ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
  document.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>52 && Math.abs(dx)>Math.abs(dy)) (dx<0?next:prev)();
  },{passive:true});

  setTimeout(function(){ help.classList.add('hide'); },5200);

  // свой номер на каждом слайде — иначе в PDF на всех страницах стоит номер активного
  slides.forEach(function(s,i){
    var m=s.querySelector('.cnt');
    if(m) m.textContent=String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  });
  var start=parseInt((location.hash||'#1').slice(1),10);
  show(isNaN(start)?0:start-1, 1);
})();
</script>
</body>
</html>
